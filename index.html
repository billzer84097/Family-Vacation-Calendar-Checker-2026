<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Summer Unavailability Calendar</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    max-width: 900px;
    margin: auto;
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
  }
  h2 {
    margin-top: 40px;
  }
  .month {
    margin-top: 30px;
  }
  .month-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
  }
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
  }
  .weekdays div {
    font-weight: bold;
    padding-bottom: 4px;
  }
  .day {
    border: 1px solid #ccc;
    padding: 8px;
    min-height: 40px;
    cursor: pointer;
    border-radius: 4px;
    background: #f9f9f9;
    position: relative;
    user-select: none;
  }
  .unavailable {
    background-color: #ffb3b3;
    border-color: #ff6b6b;
  }
  .note-badge {
    font-size: 11px;
    color: #555;
    position: absolute;
    bottom: 2px;
    left: 4px;
  }
  #summary {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  .family-color {
    font-weight: bold;
    padding: 2px 4px;
    border-radius: 3px;
  }
</style>
</head>

<body>

<h1>Family Summer Unavailability</h1>

<label>Select Family:</label>
<select id="familySelect">
  <option value="">-- Choose One --</option>

  <option>Bill & Shirlene</option>
  <option>Marty & Leyah's Family</option>
  <option>Jared & Jen's Family</option>
  <option>Jared and Shannon's Family</option>
  <option>Chris & Becka's Family</option>
  <option>Tyler & Jess' Family</option>
</select>

<br><br>

<button onclick="saveToCloud()">Save / Update</button>
<button onclick="deleteFamilyData()">Delete My Family’s Data</button>

<div id="calendar"></div>

<h2>Family Summary</h2>
<div id="summary">Loading…</div>

<script>
// === CONFIG ===
const API_URL = "https://script.google.com/macros/s/AKfycbwQhKZm5XnKEoBZ7c5KwGDfCCygVwvcO4A1rY-TserQ8h-P5K05BiK6ay7iptjYoKj5Fg/exec";

// Colors for summaries
const familyColors = {
  "Bill & Shirlene": "#ff9999",
  "Marty & Leyah's Family": "#ffcc99",
  "Jared & Jen's Family": "#ffff99",
  "Jared and Shannon's Family": "#ccffcc",
  "Chris & Becka's Family": "#99ffff",
  "Tyler & Jess' Family": "#ccccff"
};

let selectedFamily = "";
let localData = {};

document.getElementById("familySelect").addEventListener("change", (e) => {
  selectedFamily = e.target.value;
  loadLocalFamily();
});

function buildCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const months = [
    { name: "June", start: "2026-06-01", end: "2026-06-30" },
    { name: "July", start: "2026-07-01", end: "2026-07-31" },
    { name: "August", start: "2026-08-01", end: "2026-08-31" }
  ];

  months.forEach(m => {
    const monthDiv = document.createElement("div");
    monthDiv.className = "month";

    monthDiv.innerHTML = `
      <div class="month-name">${m.name}</div>
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days"></div>
    `;

    const daysContainer = monthDiv.querySelector(".days");

    const start = new Date(m.start);
    const end = new Date(m.end);
    let offset = start.getDay();

    for (let i = 0; i < offset; i++) {
      const empty = document.createElement("div");
      daysContainer.appendChild(empty);
    }

    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const ds = d.toISOString().split("T")[0];
      const div = document.createElement("div");
      div.className = "day";
      div.dataset.date = ds;
      div.textContent = d.getDate();

      if (localData[ds]) {
        div.classList.add("unavailable");
        if (localData[ds].note) {
          const badge = document.createElement("div");
          badge.className = "note-badge";
          badge.textContent = "📝";
          div.appendChild(badge);
        }
      }

      // tap toggle
      div.addEventListener("click", () => toggleDate(ds));

      // long-press for note
      let pressTimer;
      div.addEventListener("mousedown", () => {
        pressTimer = setTimeout(() => editNote(ds), 600);
      });
      div.addEventListener("mouseup", () => clearTimeout(pressTimer));
      div.addEventListener("mouseleave", () => clearTimeout(pressTimer));

      daysContainer.appendChild(div);
    }

    calendar.appendChild(monthDiv);
  });
}

function toggleDate(date) {
  if (!selectedFamily) return alert("Select a family first.");

  if (localData[date]) {
    delete localData[date];
  } else {
    localData[date] = { note: "" };
  }
  saveLocalFamily();
  buildCalendar();
}

function editNote(date) {
  if (!selectedFamily) return;

  const current = localData[date]?.note || "";
  const newNote = prompt("Add a note:", current);
  if (newNote === null) return;

  if (!localData[date]) localData[date] = {};
  localData[date].note = newNote;

  saveLocalFamily();
  buildCalendar();
}

function saveLocalFamily() {
  localStorage.setItem("fam_" + selectedFamily, JSON.stringify(localData));
}

function loadLocalFamily() {
  localData = JSON.parse(localStorage.getItem("fam_" + selectedFamily) || "{}");
  buildCalendar();
}

async function saveToCloud() {
  if (!selectedFamily) return alert("Choose a family first.");

  const entries = Object.keys(localData).map(date => ({
    date,
    note: localData[date].note || ""
  }));

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ family: selectedFamily, entries })
  });

  alert("Saved!");
  loadSummary();
}

async function deleteFamilyData() {
  if (!selectedFamily) return alert("Choose a family first.");
  if (!confirm("Delete ALL data for " + selectedFamily + "?")) return;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ family: selectedFamily, entries: [] })
  });

  localData = {};
  saveLocalFamily();
  buildCalendar();
  loadSummary();
}

async function loadSummary() {
  const res = await fetch(API_URL);
  const data = await res.json();

  const summaryDiv = document.getElementById("summary");
  summaryDiv.innerHTML = "";

  const grouped = {};

  data.forEach(row => {
    if (!grouped[row.family]) grouped[row.family] = [];
    grouped[row.family].push(row.date);
  });

  Object.keys(grouped).forEach(family => {
    const color = familyColors[family] || "#eee";
    const div = document.createElement("div");
    div.innerHTML =
      `<span class="family-color" style="background:${color}">${family}</span>: ${grouped[family].join(", ")}`;
    summaryDiv.appendChild(div);
  });
}

buildCalendar();
loadSummary();

</script>
</body>

</html>
